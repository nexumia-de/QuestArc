kind: pipeline
name: release-pipeline

steps:
  build:
    image: node:20
    commands:
      - npm install
      - cd packages/vite-plugin && npm run build && cd ../..
      - npm run package

  publish:
    image: woodpeckerci/plugin-release
    settings:
      api_key:
        from_secret: RELEASE_TOKEN
      base_url: https://codeberg.org
      forgejo: true
      files: "quest-arc-v*.zip"
      overwrite: true
    when:
      event: tag