workspace:
  path: /woodpecker/src

steps:
  - name: build
    image: node:20
    commands:
      - npm install
      - cd packages/vite-plugin && npm run build && cd ../..
      - PLUGIN_VERSION=${CI_COMMIT_TAG} npm run package
      - ls -la quest-arc*.zip
    when:
      event: tag

  - name: publish
    image: woodpeckerci/plugin-release
    settings:
      api_key:
        from_secret: release_token
      files:
        - "quest-arc*.zip"
      base_url: https://codeberg.org
    when:
      event: tag
