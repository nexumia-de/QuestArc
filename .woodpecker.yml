workspace:
  path: /woodpecker/src

pipeline:
  build:
    image: node:20
    commands:
      - npm install
      - cd packages/vite-plugin && npm run build && cd ../..
      - npm run package
      - ls -la quest-arc-v*.zip

  publish:
    image: woodpeckerci/plugin-release
    secrets: [ RELEASE_TOKEN ]
    settings:
      api_key:
        from_secret: RELEASE_TOKEN
      files:
        - "quest-arc-v*.zip"
      base_url: https://codeberg.org
    when:
      event: tag