kind: pipeline
name: release-pipeline

steps:
  build:
    image: node:20
    commands:
      - npm install
      - cd packages/vite-plugin && npm run build && cd ../..
      - npm run package
      - ls -lh *.zip

  publish:
    image: plugins/gitea-release
    settings:
      api_key:
        from_secret: RELEASE_TOKEN
      base_url: https://codeberg.org
      files:
        - "quest-arc-v*.zip"
      overwrite: true
    when:
      event: tag