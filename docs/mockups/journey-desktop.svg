<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Cantarell, Roboto, sans-serif">
  <title>QuestArc journey, desktop, calm mode (mockup)</title>
  <rect width="1000" height="700" fill="#fafafa"/>
  <rect width="1000" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="1000" y2="56" stroke="#dedede"/>
  <text x="24" y="35" font-size="18" font-weight="700" fill="#1e1e1e">Back on your feet</text>
  <g fill="#1e1e1e"><circle cx="972" cy="22" r="2.5"/><circle cx="972" cy="30" r="2.5"/><circle cx="972" cy="38" r="2.5"/></g>
  <!-- left: path -->
  <path d="M260 600 C 170 540, 170 450, 260 400" fill="none" stroke="#3a7bd5" stroke-width="6" stroke-linecap="round"/>
  <path d="M260 400 C 350 350, 350 260, 260 210" fill="none" stroke="#c9d6ea" stroke-width="6" stroke-linecap="round"/>
  <path d="M260 400 C 350 350, 350 260, 260 210" pathLength="100" fill="none" stroke="#3a7bd5" stroke-width="6" stroke-linecap="round" stroke-dasharray="80 100"/>
  <path d="M260 210 C 170 160, 170 120, 220 96" fill="none" stroke="#c9c9c9" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <circle cx="260" cy="600" r="18" fill="#3a7bd5"/>
  <path d="M251 600 l7 7 l12 -14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="292" y="596" font-size="14" fill="#1e1e1e">Shoes by the door</text>
  <text x="292" y="614" font-size="12" fill="#6b6b6b">Done · 9 Nov</text>
  <circle cx="260" cy="400" r="24" fill="#ffffff" stroke="#3a7bd5" stroke-width="6"/>
  <circle cx="260" cy="400" r="10" fill="#3a7bd5"/>
  <text x="140" y="396" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="end">You are here</text>
  <text x="140" y="414" font-size="12" fill="#6b6b6b" text-anchor="end">Walk 5 min</text>
  <circle cx="260" cy="210" r="15" fill="#ffffff" stroke="#9a9a9a" stroke-width="3"/>
  <text x="292" y="206" font-size="14" fill="#1e1e1e">Walk 15 min</text>
  <text x="292" y="224" font-size="12" fill="#6b6b6b">Next station</text>
  <path d="M220 96 v-24 l20 8 l-20 8" fill="#9a9a9a"/>
  <!-- right: current station -->
  <rect x="520" y="80" width="456" height="596" rx="14" fill="#ffffff" stroke="#dedede"/>
  <text x="544" y="116" font-size="12" fill="#6b6b6b">STATION 2 OF 3</text>
  <text x="544" y="146" font-size="20" font-weight="700" fill="#1e1e1e">After lunch, I will walk for 5 minutes.</text>
  <text x="544" y="176" font-size="13" fill="#6b6b6b">Daily · Your reason: "I want my afternoons back."</text>
  <rect x="544" y="200" width="408" height="10" rx="5" fill="#e6ecf5"/>
  <rect x="544" y="200" width="326" height="10" rx="5" fill="#3a7bd5"/>
  <text x="544" y="232" font-size="14" fill="#1e1e1e">4 of 5 days in the last week · Run 4 · best 6 · 15 in total</text>
  <g font-size="11" fill="#6b6b6b" text-anchor="middle">
    <circle cx="560" cy="264" r="9" fill="#3a7bd5"/><text x="560" y="290">Mo</text>
    <circle cx="596" cy="264" r="9" fill="#3a7bd5"/><text x="596" y="290">Tu</text>
    <circle cx="632" cy="264" r="8" fill="#ffffff" stroke="#9a9a9a" stroke-width="2"/><line x1="626" y1="264" x2="638" y2="264" stroke="#9a9a9a" stroke-width="2"/><text x="632" y="290">We</text>
    <circle cx="668" cy="264" r="9" fill="#3a7bd5"/><text x="668" y="290">Th</text>
    <circle cx="704" cy="264" r="9" fill="#3a7bd5"/><text x="704" y="290">Fr</text>
    <circle cx="740" cy="264" r="8" fill="#ffffff" stroke="#3a7bd5" stroke-width="2" stroke-dasharray="3 3"/><text x="740" y="290">Sa</text>
  </g>
  <rect x="544" y="316" width="408" height="120" rx="10" fill="#f3f6fb"/>
  <text x="564" y="346" font-size="13" font-weight="700" fill="#1e1e1e">Try this</text>
  <text x="564" y="372" font-size="13" fill="#1e1e1e">Missing one day is fine. What matters is coming</text>
  <text x="564" y="392" font-size="13" fill="#1e1e1e">back the next time.</text>
  <text x="544" y="476" font-size="13" fill="#6b6b6b">The street outside feels a little more familiar.</text>
  <text x="544" y="652" font-size="12" fill="#6b6b6b">Tick off "Walk 5 min" in your task list.</text>
</svg>
