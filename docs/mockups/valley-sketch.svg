<svg xmlns="http://www.w3.org/2000/svg" width="780" height="760" viewBox="0 0 780 760" font-family="Cantarell, Roboto, sans-serif">
  <title>QuestArc: the journey as its region, and the Valley map (mockup)</title>
  <defs>
    <g id="tree"><path d="M0 -22 l9 16 h-18z M0 -12 l11 18 h-22z" fill="#8fa3bf"/><rect x="-1.5" y="6" width="3" height="7" fill="#8fa3bf"/></g>
    <g id="bush"><circle cx="-5" cy="0" r="5" fill="#a9b9d0"/><circle cx="3" cy="-2" r="6" fill="#a9b9d0"/><circle cx="9" cy="1" r="4" fill="#a9b9d0"/></g>
    <g id="tuft"><path d="M-4 0 l1 -6 M0 0 v-8 M4 0 l-1 -6" stroke="#a9b9d0" stroke-width="1.6" stroke-linecap="round" fill="none"/></g>
    <g id="flower"><path d="M0 0 v-7" stroke="#a9b9d0" stroke-width="1.6"/><circle cx="0" cy="-9" r="2.6" fill="#3a7bd5"/></g>
    <g id="pennant"><path d="M0 12 v-30 l16 6 l-16 6" fill="#3a7bd5" stroke="#3a7bd5" stroke-width="2" stroke-linejoin="round"/></g>
    <g id="lantern"><path d="M0 14 v-18" stroke="#1e1e1e" stroke-width="2"/><rect x="-6" y="-18" width="12" height="14" rx="2" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><circle cx="0" cy="-11" r="3.2" fill="#3a7bd5"/><path d="M-12 -11 h-4 M12 -11 h4 M0 -24 v-4 M-9 -20 l-3 -3 M9 -20 l3 -3" stroke="#3a7bd5" stroke-width="1.8" stroke-linecap="round"/></g>
    <g id="house"><path d="M-11 10 v-13 l11 -9 l11 9 v13z" fill="#ffffff" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/><rect x="-3" y="1" width="6" height="9" fill="#1e1e1e"/></g>
    <g id="well"><path d="M-9 10 v-8 h18 v8z" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><path d="M-9 2 v-10 M9 2 v-10 M-12 -8 l12 -7 l12 7" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/></g>
    <g id="bench"><path d="M-12 2 h24 M-12 -5 h24 M-9 2 v8 M9 2 v8 M-9 -5 v7 M9 -5 v7" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/></g>
    <g id="gate"><path d="M-12 12 v-22 M12 12 v-22 M-12 -10 q12 -10 24 0" fill="none" stroke="#1e1e1e" stroke-width="2.4" stroke-linecap="round"/><path d="M12 -4 l10 4 v10 l-10 -2" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.8" stroke-linejoin="round"/></g>
  </defs>

  <rect width="780" height="760" fill="#eeeeee"/>
  <text x="20" y="24" font-size="13" font-weight="700" fill="#1e1e1e">Journey: the path runs through its region</text>
  <text x="420" y="24" font-size="13" font-weight="700" fill="#1e1e1e">The Valley: every journey's region, small</text>

  <!-- ===== phone 1: journey as region ===== -->
  <g transform="translate(10 34)">
    <rect width="360" height="720" fill="#fafafa"/>
    <rect width="360" height="56" fill="#ffffff"/>
    <line x1="0" y1="56" x2="360" y2="56" stroke="#dedede"/>
    <text x="20" y="35" font-size="17" font-weight="700" fill="#1e1e1e">Back on your feet</text>
    <rect x="262" y="17" width="54" height="24" rx="12" fill="#e6ecf5"/>
    <text x="289" y="34" font-size="12" font-weight="700" fill="#1e1e1e" text-anchor="middle">Lv 3</text>
    <g fill="#1e1e1e"><circle cx="336" cy="22" r="2.5"/><circle cx="336" cy="30" r="2.5"/><circle cx="336" cy="38" r="2.5"/></g>

    <!-- grown ground behind the user -->
    <path d="M0 520 q90 -40 180 -10 t180 -20 v70 h-360z" fill="#e6ecf5"/>
    <path d="M0 400 q120 -50 230 -6 q70 26 130 -8 v130 q-90 30 -180 10 t-180 14z" fill="#edf1f7"/>
    <use href="#tree" x="40" y="478"/><use href="#tree" x="66" y="494"/><use href="#tree" x="316" y="470"/>
    <use href="#bush" x="286" y="500"/><use href="#bush" x="96" y="528"/>
    <use href="#tuft" x="140" y="500"/><use href="#tuft" x="236" y="520"/><use href="#tuft" x="300" y="536"/><use href="#tuft" x="30" y="540"/>
    <use href="#flower" x="122" y="470"/><use href="#flower" x="252" y="478"/><use href="#flower" x="210" y="536"/>
    <use href="#tuft" x="60" y="392"/><use href="#tuft" x="250" y="410"/><use href="#flower" x="92" y="418"/><use href="#bush" x="300" y="396"/>
    <use href="#tuft" x="236" y="340"/><use href="#tuft" x="70" y="330"/>

    <!-- path -->
    <path d="M180 560 C 250 530, 250 480, 180 450" fill="none" stroke="#3a7bd5" stroke-width="5" stroke-linecap="round"/>
    <path d="M180 450 C 110 410, 110 350, 180 310" fill="none" stroke="#3a7bd5" stroke-width="5" stroke-linecap="round"/>
    <path d="M180 310 C 250 270, 250 210, 180 170" fill="none" stroke="#c9d6ea" stroke-width="5" stroke-linecap="round"/>
    <path d="M180 310 C 250 270, 250 210, 180 170" pathLength="100" fill="none" stroke="#3a7bd5" stroke-width="5" stroke-linecap="round" stroke-dasharray="60 100"/>
    <path d="M180 170 C 110 130, 110 100, 150 80" fill="none" stroke="#c9c9c9" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>

    <!-- start -->
    <circle cx="180" cy="560" r="7" fill="#3a7bd5"/>
    <!-- station 1 done, with its landmark -->
    <circle cx="180" cy="450" r="16" fill="#3a7bd5"/>
    <path d="M172 450 l6 6 l11 -12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#house" x="232" y="440"/>
    <text x="252" y="436" font-size="13" fill="#1e1e1e">The Door</text>
    <text x="252" y="452" font-size="12" fill="#6b6b6b">Shoes by the door</text>
    <!-- keeper on the first segment -->
    <use href="#gate" x="112" y="384"/>
    <text x="16" y="356" font-size="12" font-weight="700" fill="#1e1e1e">The Grey</text>
    <text x="16" y="371" font-size="11" fill="#6b6b6b">keeps the gate</text>
    <!-- station 2 current -->
    <circle cx="180" cy="310" r="22" fill="#ffffff" stroke="#3a7bd5" stroke-width="5"/>
    <use href="#pennant" x="176" y="310"/>
    <text x="214" y="306" font-size="13" font-weight="700" fill="#1e1e1e">You are here</text>
    <text x="214" y="322" font-size="12" fill="#6b6b6b">Walk 5 min</text>
    <!-- guardian ahead -->
    <path d="M222 206 l14 -14 l14 14 l-14 14z" fill="#ffffff" stroke="#1e1e1e" stroke-width="3"/>
    <text x="258" y="202" font-size="12" font-weight="700" fill="#1e1e1e">The Hill</text>
    <rect x="258" y="208" width="60" height="6" rx="3" fill="#e2e2e2"/><rect x="258" y="208" width="42" height="6" rx="3" fill="#1e1e1e"/>
    <!-- station 3 ahead: bare ground, nothing announced -->
    <circle cx="180" cy="170" r="9" fill="#fafafa" stroke="#9a9a9a" stroke-width="3"/>
    <text x="20" y="174" font-size="12" fill="#6b6b6b">Walk 15 min</text>
    <path d="M150 92 v-26 l14 5 l-14 5" fill="none" stroke="#9a9a9a" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="174" y="78" font-size="12" fill="#6b6b6b">A walk every day</text>

    <!-- card -->
    <rect x="12" y="590" width="336" height="118" rx="14" fill="#ffffff" stroke="#dedede"/>
    <text x="28" y="616" font-size="14" font-weight="700" fill="#1e1e1e">After lunch, I walk for 5 minutes.</text>
    <rect x="28" y="628" width="304" height="8" rx="4" fill="#e2e2e2"/><rect x="28" y="628" width="182" height="8" rx="4" fill="#3a7bd5"/>
    <text x="28" y="654" font-size="12" fill="#6b6b6b">3 of 5 days · Run 3 · best 6</text>
    <g>
      <circle cx="40" cy="682" r="8" fill="#3a7bd5"/><circle cx="72" cy="682" r="8" fill="#3a7bd5"/>
      <circle cx="104" cy="682" r="7" fill="none" stroke="#9a9a9a" stroke-width="2"/><path d="M100 682 h8" stroke="#9a9a9a" stroke-width="2"/>
      <circle cx="136" cy="682" r="8" fill="#3a7bd5"/><circle cx="168" cy="682" r="8" fill="#3a7bd5"/><circle cx="200" cy="682" r="8" fill="#3a7bd5"/>
      <circle cx="232" cy="682" r="7" fill="none" stroke="#3a7bd5" stroke-width="2" stroke-dasharray="3 3"/>
    </g>
  </g>

  <!-- ===== phone 2: the Valley ===== -->
  <g transform="translate(410 34)">
    <rect width="360" height="720" fill="#fafafa"/>
    <rect width="360" height="56" fill="#ffffff"/>
    <line x1="0" y1="56" x2="360" y2="56" stroke="#dedede"/>
    <path d="M22 30 l8 -8 M22 30 l8 8" stroke="#1e1e1e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <text x="44" y="35" font-size="17" font-weight="700" fill="#1e1e1e">The Valley</text>
    <text x="340" y="35" font-size="13" fill="#3a7bd5" text-anchor="end">Atlas</text>

    <!-- road between regions -->
    <path d="M180 690 C 120 640, 240 600, 180 548" fill="none" stroke="#3a7bd5" stroke-width="4" stroke-linecap="round"/>
    <path d="M180 392 C 120 360, 240 330, 180 300" fill="none" stroke="#3a7bd5" stroke-width="4" stroke-linecap="round"/>
    <path d="M180 144 C 150 124, 200 104, 180 86" fill="none" stroke="#c9c9c9" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
    <text x="180" y="76" font-size="12" fill="#6b6b6b" text-anchor="middle">The road goes on when you do.</text>

    <!-- region 1: finished and graduated -->
    <g transform="translate(16 400)">
      <rect width="328" height="150" rx="14" fill="#ffffff" stroke="#dedede"/>
      <path d="M1 100 q60 -34 130 -14 t196 -16 v36 h-326z" fill="#e6ecf5"/>
      <use href="#tree" x="30" y="78"/><use href="#tree" x="50" y="88"/><use href="#tree" x="296" y="72"/><use href="#tree" x="274" y="84"/>
      <use href="#bush" x="230" y="92"/><use href="#flower" x="120" y="96"/><use href="#flower" x="198" y="98"/><use href="#tuft" x="150" y="100"/><use href="#tuft" x="80" y="102"/>
      <use href="#well" x="96" y="76"/><use href="#bench" x="150" y="80"/><use href="#house" x="204" y="72"/>
      <use href="#pennant" x="244" y="70"/><use href="#lantern" x="170" y="42"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#1e1e1e">Dawn Meadow</text>
      <text x="16" y="136" font-size="12" fill="#6b6b6b">3 of 3 landmarks · 142 times · lantern lit</text>
    </g>
    <!-- region 2: current -->
    <g transform="translate(16 150)">
      <rect width="328" height="150" rx="14" fill="#ffffff" stroke="#3a7bd5" stroke-width="2"/>
      <path d="M1 100 q80 -30 160 -10 t166 -12 v28 h-326z" fill="#edf1f7"/>
      <path d="M1 100 q40 -16 90 -14 q20 4 40 16 h-130z" fill="#e6ecf5"/>
      <use href="#tree" x="34" y="80"/><use href="#tuft" x="70" y="98"/><use href="#flower" x="56" y="100"/><use href="#tuft" x="118" y="102"/>
      <use href="#house" x="92" y="76"/><use href="#gate" x="136" y="80"/>
      <use href="#pennant" x="176" y="78" opacity="0"/>
      <circle cx="176" cy="86" r="9" fill="#ffffff" stroke="#3a7bd5" stroke-width="3"/>
      <path d="M174 92 v-16 l9 3.5 l-9 3.5" fill="#3a7bd5"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#1e1e1e">Walker's Shore</text>
      <text x="312" y="24" font-size="12" fill="#3a7bd5" text-anchor="end">You are here</text>
      <text x="16" y="136" font-size="12" fill="#6b6b6b">1 of 3 landmarks · 31 times</text>
    </g>
  </g>
</svg>
