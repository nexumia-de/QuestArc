<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" font-family="Cantarell, Roboto, sans-serif">
  <title>QuestArc journey, phone, calm mode (mockup)</title>
  <rect width="360" height="720" fill="#fafafa"/>
  <!-- header -->
  <rect width="360" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="360" y2="56" stroke="#dedede"/>
  <text x="20" y="35" font-size="17" font-weight="700" fill="#1e1e1e">Back on your feet</text>
  <g fill="#1e1e1e"><circle cx="330" cy="22" r="2.5"/><circle cx="330" cy="30" r="2.5"/><circle cx="330" cy="38" r="2.5"/></g>
  <!-- path: done (solid), current segment partly filled, ahead (dashed) -->
  <path d="M180 440 C 110 400, 110 340, 180 300" fill="none" stroke="#3a7bd5" stroke-width="5" stroke-linecap="round"/>
  <path d="M180 300 C 250 260, 250 200, 180 160" fill="none" stroke="#c9d6ea" stroke-width="5" stroke-linecap="round"/>
  <path d="M180 300 C 250 260, 250 200, 180 160" pathLength="100" fill="none" stroke="#3a7bd5" stroke-width="5" stroke-linecap="round" stroke-dasharray="80 100"/>
  <path d="M180 160 C 110 120, 110 90, 150 70" fill="none" stroke="#c9c9c9" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>
  <!-- station 1: done -->
  <circle cx="180" cy="440" r="16" fill="#3a7bd5"/>
  <path d="M172 440 l6 6 l11 -12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="206" y="436" font-size="13" fill="#1e1e1e">Shoes by the door</text>
  <text x="206" y="452" font-size="12" fill="#6b6b6b">Done · 9 Nov</text>
  <!-- station 2: current, "you are here" -->
  <circle cx="180" cy="300" r="22" fill="#ffffff" stroke="#3a7bd5" stroke-width="5"/>
  <circle cx="180" cy="300" r="9" fill="#3a7bd5"/>
  <text x="20" y="296" font-size="13" font-weight="700" fill="#1e1e1e">You are here</text>
  <text x="20" y="312" font-size="12" fill="#6b6b6b">Walk 5 min</text>
  <!-- station 3: ahead -->
  <circle cx="180" cy="160" r="14" fill="#ffffff" stroke="#9a9a9a" stroke-width="3"/>
  <text x="206" y="156" font-size="13" fill="#1e1e1e">Walk 15 min</text>
  <text x="206" y="172" font-size="12" fill="#6b6b6b">Next station</text>
  <!-- finish -->
  <path d="M150 70 v-22 l18 7 l-18 7" fill="#9a9a9a"/>
  <text x="172" y="66" font-size="12" fill="#6b6b6b">Walking is part of your day</text>
  <!-- bottom card: current station -->
  <rect x="12" y="496" width="336" height="212" rx="14" fill="#ffffff" stroke="#dedede"/>
  <text x="28" y="526" font-size="12" fill="#6b6b6b">STATION 2 OF 3</text>
  <text x="28" y="550" font-size="15" font-weight="700" fill="#1e1e1e">After lunch, I will walk</text>
  <text x="28" y="570" font-size="15" font-weight="700" fill="#1e1e1e">for 5 minutes.</text>
  <!-- condition bar -->
  <rect x="28" y="588" width="304" height="10" rx="5" fill="#e6ecf5"/>
  <rect x="28" y="588" width="243" height="10" rx="5" fill="#3a7bd5"/>
  <text x="28" y="618" font-size="13" fill="#1e1e1e">4 of 5 days in the last week</text>
  <!-- last 7 due days: done, done, gap, done, done, today, not due -->
  <g font-size="10" fill="#6b6b6b" text-anchor="middle">
    <circle cx="40" cy="644" r="8" fill="#3a7bd5"/><text x="40" y="666">Mo</text>
    <circle cx="70" cy="644" r="8" fill="#3a7bd5"/><text x="70" y="666">Tu</text>
    <circle cx="100" cy="644" r="7" fill="#ffffff" stroke="#9a9a9a" stroke-width="2"/><line x1="95" y1="644" x2="105" y2="644" stroke="#9a9a9a" stroke-width="2"/><text x="100" y="666">We</text>
    <circle cx="130" cy="644" r="8" fill="#3a7bd5"/><text x="130" y="666">Th</text>
    <circle cx="160" cy="644" r="8" fill="#3a7bd5"/><text x="160" y="666">Fr</text>
    <circle cx="190" cy="644" r="7" fill="#ffffff" stroke="#3a7bd5" stroke-width="2" stroke-dasharray="3 3"/><text x="190" y="666">Sa</text>
  </g>
  <text x="220" y="648" font-size="12" fill="#6b6b6b">Run 4 · best 6</text>
  <text x="28" y="694" font-size="12" fill="#6b6b6b">Tick off "Walk 5 min" in your task list.</text>
</svg>
