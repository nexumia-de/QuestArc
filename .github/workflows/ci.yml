# Checks every pull request and every push to main: format, lint,
# typecheck, tests and build (npm run check), then keeps the plugin ZIP
# as an artifact so it can be tried in Super Productivity. The engine's
# test vectors also run in gjs (QUESTARC_GJS), the runtime Pensum uses.
# The job speed-aarch64 runs the engine's speed budget (large archive) in Node
# and in gjs on an arm64 runner and writes the times and the CPU to the job
# summary (issue #83). The job real-app installs the plugin in Super Productivity's web app at
# a pinned version (packages/plugin/e2e/Dockerfile) and walks the first
# stage of a journey in it, at phone and desktop size. The job standalone-app
# (issue #93, a spike, not a required check) walks the standalone web app
# in a browser, offline after the first load, and imports its export into
# the same Super Productivity.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install gjs for the engine's test vectors
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs
      - run: npm ci
      - run: npm run check
        env:
          QUESTARC_GJS: gjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: questarc-plugin
          path: packages/plugin/dist/*.zip
          if-no-files-found: error

  speed-aarch64:
    name: speed-aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install gjs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs
      - run: npm ci
      - name: Speed budget in Node and gjs, times to the job summary
        run: |
          {
            echo "### Engine speed on $(uname -m)"
            echo
            echo "CPU: $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) cores; gjs $(gjs --version)"
            echo
            echo "| Runtime | Measured | Archive | ms per run | best ms |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          npm run build -w @questarc/engine
          QUESTARC_SPEED_REPORT="$GITHUB_STEP_SUMMARY" npx vitest run test/speed.test.ts
        working-directory: packages/engine
        env:
          QUESTARC_GJS: gjs

  real-app:
    name: real-app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start Super Productivity at the pinned version
        run: |
          docker build -t questarc-sp packages/plugin/e2e
          docker run -d -p 8080:80 questarc-sp
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:8080/; do sleep 2; done'
      - name: Install, start a journey, complete the task (phone and desktop)
        run: npm run e2e -w @questarc/plugin
        env:
          QUESTARC_SP_URL: http://localhost:8080/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-app-screenshots
          path: packages/plugin/dist/real-app/
          if-no-files-found: ignore

  standalone-app:
    name: standalone-app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Walk the app (phone and desktop), offline after the first load
        run: npm run e2e -w @questarc/app
      - name: Start Super Productivity at the pinned version
        run: |
          docker build -t questarc-sp packages/plugin/e2e
          docker run -d -p 8080:80 questarc-sp
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:8080/; do sleep 2; done'
      - name: Import the app's export, no repair, the plugin shows the same journey
        run: npm run e2e:import -w @questarc/app
        env:
          QUESTARC_SP_URL: http://localhost:8080/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: standalone-app-walk
          path: packages/app/dist/walk/
          if-no-files-found: ignore
