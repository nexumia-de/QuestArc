# Weekly pull requests for new versions of npm packages and GitHub
# Actions; every version is pinned exactly (phosh-toolkit
# docs/dependency-updates.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    ignore:
      # Node types follow the Node version in .nvmrc (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint supports TypeScript below 6.1; TypeScript 7 (the
      # native compiler) waits until it does (docs/dependencies.md).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /packages/plugin/e2e
    schedule:
      interval: weekly
    ignore:
      # The real-app check runs against the oldest supported Super
      # Productivity (minSupVersion 19.3.0); one build serves all versions
      # (docs/decisions/one-build-for-older-versions.md).
      - dependency-name: johannesjo/super-productivity
        update-types: ['version-update:semver-major']
